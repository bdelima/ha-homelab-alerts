alias: "Homelab Alerts"
blueprint:
  name: "Homelab Alerts"
  description: >-
    Routes homelab-ops's generic MQTT alerting (bdelima/homelab-ops --
    mqtt-alert.sh / homelab-alert@.service, plus a few scripts that
    publish directly for their own internal non-binary states) to a
    phone push and/or a Home Assistant persistent notification, chosen
    per severity, with the severity in each alert's own JSON payload
    picking which Android notification channel the phone push lands on. Installed
    automatically by the Homelab Alerts integration -- this file is
    regenerated on every integration load, so don't hand-edit this
    deployed copy.

    Every alert publishes to an MQTT topic under homelab/alerts/<unit>
    with a JSON payload: {"host", "unit", "severity", "message"}, where
    severity is one of info/warning/critical. This blueprint triggers on
    the whole homelab/alerts/+ wildcard rather than one topic per alert
    source, so a new alert source on the homelab-ops side needs zero
    changes here -- it only ever needs a severity, which it already
    carries.

    Three severities, not per-module channel sets: a module decides its
    own severity for a given event (that's its "say" in notification
    behavior), but the channel/Do-Not-Disturb-bypass choice lives here,
    once per severity, the same way ha-portainer-dashboard's three
    category channels (Updates/Trouble/Stale Devices) work -- see that
    blueprint for the precedent this one follows. Once a channel exists
    on your phone, Android's own per-channel settings (sound,
    importance, lock-screen visibility, or silencing it entirely) are
    fully yours to adjust afterward -- this blueprint only creates the
    channel and routes to it, it doesn't try to encode "how annoying"
    beyond the bypass-DND choice below, which needs to be explicit since
    it's the one thing Android's own channel settings can't grant
    after the fact.

    Each severity also has two on/off toggles: Mobile Notification (the
    phone push) and Persistent Notification (an entry in Home
    Assistant's own notification panel, the bell in the sidebar). Both
    are on by default. A persistent notification is created fresh for
    every alert and stays until you dismiss it, so a repeating alert
    adds a new entry each time.

    Each severity also has its own look, so it reads at a glance: an
    emoji at the start of the title (info ℹ️, warning ⚠️, critical ❗),
    and, on the phone push, a matching Android status-bar icon and
    color (information / alert / alert-circle, in blue / amber / red).
    The emoji appears on the persistent notification's title too. The
    status-bar icon and color are Android-only, like the channels.
  domain: automation
  input:
    notify_device:
      name: Notify device(s)
      description: >-
        The mobile_app device(s) every homelab alert goes to. Select more
        than one to push to multiple phones/tablets. Only used for the
        severities whose Mobile Notification toggle is on, but still
        required.
      selector:
        device:
          filter:
            integration: mobile_app
          multiple: true

    info_mobile:
      name: Info -- Mobile Notification
      description: >-
        Send info-severity alerts as a push to the device(s) above. On by
        default. Turn off to stop info alerts reaching your phone at all;
        the channel and Bypass Do Not Disturb settings for info below
        only apply while this is on.
      default: true
      selector:
        boolean: {}
    info_persistent:
      name: Info -- Persistent Notification
      description: >-
        Also create a Home Assistant persistent notification for
        info-severity alerts (the bell in the sidebar). Each alert adds
        a new entry that stays until you dismiss it. On by default.
      default: true
      selector:
        boolean: {}

    info_channel:
      name: Info Notification Channel
      description: >-
        Android notification channel for info-severity alerts (e.g. a
        clean backup completion, or mount-healthcheck deferring to an
        in-progress backup). Customize sound, importance, and
        lock-screen visibility for this channel in your phone's own
        notification settings after it's first created -- or turn it off
        entirely there if routine "everything's fine" pings turn out to
        be more noise than reassurance. No effect on iOS.
      default: "Homelab Info"
      selector:
        select:
          options:
            - "Homelab Info"
          custom_value: true
    info_bypass_dnd:
      name: Info -- Bypass Do Not Disturb
      description: >-
        When on, info pushes use Android's reserved alarm_stream channel
        instead of the channel above. alarm_stream plays at alarm volume
        and bypasses silent mode and Do Not Disturb, the same way a phone
        alarm clock does -- it's a channel shared phone-wide with any
        other app or automation that also uses it, not exclusive to this
        integration. Off by default, and there's essentially never a
        reason to turn this on for info-severity alerts.
      default: false
      selector:
        boolean: {}

    warning_mobile:
      name: Warning -- Mobile Notification
      description: >-
        Send warning-severity alerts as a push to the device(s) above. On by
        default. Turn off to stop warning alerts reaching your phone at all;
        the channel and Bypass Do Not Disturb settings for warning below
        only apply while this is on.
      default: true
      selector:
        boolean: {}
    warning_persistent:
      name: Warning -- Persistent Notification
      description: >-
        Also create a Home Assistant persistent notification for
        warning-severity alerts (the bell in the sidebar). Each alert adds
        a new entry that stays until you dismiss it. On by default.
      default: true
      selector:
        boolean: {}

    warning_channel:
      name: Warning Notification Channel
      description: >-
        Android notification channel for warning-severity alerts (e.g.
        a backup that completed but flagged issues, a SMART attribute
        trending up, routine disk-space/storage-tiering housekeeping
        that needs a look but isn't broken). Customize sound,
        importance, and lock-screen visibility in your phone's own
        notification settings after it's first created. No effect on
        iOS.
      default: "Homelab Warning"
      selector:
        select:
          options:
            - "Homelab Warning"
          custom_value: true
    warning_bypass_dnd:
      name: Warning -- Bypass Do Not Disturb
      description: >-
        When on, warning pushes use Android's reserved alarm_stream
        channel instead of the channel above. Shared phone-wide, not
        exclusive to this integration. Off by default.
      default: false
      selector:
        boolean: {}

    critical_mobile:
      name: Critical -- Mobile Notification
      description: >-
        Send critical-severity alerts as a push to the device(s) above. On by
        default. Turn off to stop critical alerts reaching your phone at all;
        the channel and Bypass Do Not Disturb settings for critical below
        only apply while this is on.
      default: true
      selector:
        boolean: {}
    critical_persistent:
      name: Critical -- Persistent Notification
      description: >-
        Also create a Home Assistant persistent notification for
        critical-severity alerts (the bell in the sidebar). Each alert adds
        a new entry that stays until you dismiss it. On by default.
      default: true
      selector:
        boolean: {}

    critical_channel:
      name: Critical Notification Channel
      description: >-
        Android notification channel for critical-severity alerts (a
        backup that never finished, a real mount failure, a SMART drive
        failure, a btrfs scrub finding uncorrectable errors). Customize
        sound, importance, and lock-screen visibility in your phone's
        own notification settings after it's first created. No effect on
        iOS.
      default: "Homelab Critical"
      selector:
        select:
          options:
            - "Homelab Critical"
          custom_value: true
    critical_bypass_dnd:
      name: Critical -- Bypass Do Not Disturb
      description: >-
        When on, critical pushes use Android's reserved alarm_stream
        channel instead of the channel above. alarm_stream plays at
        alarm volume and bypasses silent mode and Do Not Disturb, the
        same way a phone alarm clock does -- it's a channel shared
        phone-wide with any other app or automation that also uses it,
        not exclusive to this integration, and its reliability varies by
        Android version/OEM. Off by default, same reasoning
        ha-portainer-dashboard's Trouble channel landed on after
        github.com/bdelima/ha-portainer-dashboard/issues/1 -- opt in
        deliberately rather than having every critical alert ring like
        an alarm clock.
      default: false
      selector:
        boolean: {}

trigger:
  - trigger: mqtt
    id: alert
    topic: homelab/alerts/+
  # A tap on the phone push's "Dismiss" button. The companion app reports
  # every notification action tap to Home Assistant as a
  # mobile_app_notification_action event; this trigger catches the
  # "dismiss" ones so the tap reaches an automation run, the same way
  # ha-portainer-dashboard's blueprint does (it triggers on that event
  # for every action and falls through when nothing matches). The run
  # does nothing -- see the condition at the top of `action`. In
  # particular it sends no clear_notification, so no other device's
  # notification is touched.
  - trigger: event
    id: dismiss_tap
    event_type: mobile_app_notification_action
    event_data:
      action: dismiss

action:
  # Only the MQTT alert goes on to the steps below. They read
  # trigger.payload, which a Dismiss tap does not have, so without this
  # the tap's run would fail on the first step.
  - condition: trigger
    id: alert
  - variables:
      notify_devices: !input notify_device
      notify_services: "{{ notify_devices | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list }}"
      # mqtt-alert.sh is the only publisher and always sends valid JSON
      # (it validates severity before publishing) -- from_json is used
      # directly rather than defensively, same trust level this project
      # gives its own other MQTT payloads.
      payload: "{{ trigger.payload | from_json }}"
      alert_host: "{{ payload.host }}"
      alert_unit: "{{ payload.unit }}"
      alert_severity: "{{ payload.severity }}"
      alert_message: "{{ payload.message }}"
      info_mobile: !input info_mobile
      info_persistent: !input info_persistent
      warning_mobile: !input warning_mobile
      warning_persistent: !input warning_persistent
      critical_mobile: !input critical_mobile
      critical_persistent: !input critical_persistent
      info_channel_name: !input info_channel
      info_bypass_dnd: !input info_bypass_dnd
      info_channel: "{{ 'alarm_stream' if info_bypass_dnd else info_channel_name }}"
      warning_channel_name: !input warning_channel
      warning_bypass_dnd: !input warning_bypass_dnd
      warning_channel: "{{ 'alarm_stream' if warning_bypass_dnd else warning_channel_name }}"
      critical_channel_name: !input critical_channel
      critical_bypass_dnd: !input critical_bypass_dnd
      critical_channel: "{{ 'alarm_stream' if critical_bypass_dnd else critical_channel_name }}"
      # Anything other than info/warning/critical (shouldn't happen --
      # mqtt-alert.sh rejects an invalid severity before it ever
      # publishes) falls back to the warning channel rather than being
      # silently dropped.
      resolved_channel: >-
        {{ critical_channel if alert_severity == 'critical'
           else info_channel if alert_severity == 'info'
           else warning_channel }}
      # How each severity looks: a title emoji, plus the Android status-bar
      # icon (a Material Design icon) and its color. Same fallback as the
      # channel: an unexpected severity looks like warning.
      severity_emoji: >-
        {{ '❗' if alert_severity == 'critical'
           else 'ℹ️' if alert_severity == 'info'
           else '⚠️' }}
      severity_icon: >-
        {{ 'mdi:alert-circle' if alert_severity == 'critical'
           else 'mdi:information' if alert_severity == 'info'
           else 'mdi:alert' }}
      severity_color: >-
        {{ '#D32F2F' if alert_severity == 'critical'
           else '#1976D2' if alert_severity == 'info'
           else '#FFA000' }}
      # Same fallback as the channel above: an unexpected severity is
      # treated as warning, so it still reaches whichever outputs the
      # warning toggles allow instead of being dropped.
      send_mobile: >-
        {{ critical_mobile if alert_severity == 'critical'
           else info_mobile if alert_severity == 'info'
           else warning_mobile }}
      send_persistent: >-
        {{ critical_persistent if alert_severity == 'critical'
           else info_persistent if alert_severity == 'info'
           else warning_persistent }}
  # Persistent notification first: it is local to Home Assistant and does
  # not depend on a phone being reachable, so it still lands if the mobile
  # push below fails. No notification_id on purpose -- Home Assistant then
  # generates a unique one, so every alert adds a new entry rather than
  # replacing the previous one. The severity goes in the title because a
  # persistent notification has no channel to carry it.
  - if:
      - condition: template
        value_template: "{{ send_persistent }}"
    then:
      - action: persistent_notification.create
        data:
          title: "{{ severity_emoji }} {{ alert_host }}: {{ alert_unit }} ({{ alert_severity }})"
          message: "{{ alert_message }}"
  - if:
      - condition: template
        value_template: "{{ send_mobile }}"
    then:
      - repeat:
          for_each: "{{ notify_services }}"
          sequence:
            - action: "{{ repeat.item }}"
              data:
                title: "{{ severity_emoji }} {{ alert_host }}: {{ alert_unit }}"
                message: "{{ alert_message }}"
                data:
                  tag: "homelab_alert_{{ alert_host }}_{{ alert_unit }}"
                  channel: "{{ resolved_channel }}"
                  notification_icon: "{{ severity_icon }}"
                  color: "{{ severity_color }}"
                  actions:
                    - action: "dismiss"
                      title: "Dismiss"

mode: queued
max: 10
